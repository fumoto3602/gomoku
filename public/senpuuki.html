<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>せんぷうき</title>

<style>
  body {
    text-align: center;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  /* 扇風機外枠 */
  #fan {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border-radius: 50%;
    background: radial-gradient(#ddd, #aaa);
    border: 12px solid #666;
    position: relative;
  }

  /* 羽全体 */
  #blades {
    width: 100%;
    height: 100%;
    position: absolute;
  }

  .blade {
    position: absolute;
    width: 50px;
    height: 150px;
    top: 40px;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 25px 25px 10px 10px;
    background: linear-gradient(to right, #7fbfff, #3a7bd5, #7fbfff);
    opacity: 0.9;
  }

  .b1 { transform: translateX(-50%) rotate(0deg); }
  .b2 { transform: translateX(-50%) rotate(90deg); }
  .b3 { transform: translateX(-50%) rotate(180deg); }
  .b4 { transform: translateX(-50%) rotate(270deg); }

  #center {
    position: absolute;
    width: 50px;
    height: 50px;
    background: radial-gradient(#666, #222);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }

  .rotate {
    animation: spin 0.35s linear infinite;
    filter: blur(1.5px);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 🔴 目立つ赤枠ボタン */
  button {
    font-size: 26px;
    padding: 14px 50px;
    margin-top: 20px;
    border: 5px solid red;
    border-radius: 16px;
    background: #fff;
    cursor: pointer;
  }

  button:active {
    background: #ffe5e5;
  }
</style>
</head>

<body>

<h2>せんぷうき</h2>

<div id="fan">
  <div id="blades">
    <div class="blade b1"></div>
    <div class="blade b2"></div>
    <div class="blade b3"></div>
    <div class="blade b4"></div>
  </div>
  <div id="center"></div>
</div>

<button onclick="toggleFan()">まわす / とめる</button>

<!-- 🎵 音 -->
<audio id="fanSound" src="fan.mp3" loop></audio>

<script>
  let isOn = false;

  function toggleFan() {
    const blades = document.getElementById("blades");
    const sound = document.getElementById("fanSound");

    isOn = !isOn;

    if (isOn) {
      blades.classList.add("rotate");
      sound.currentTime = 0;
      sound.play();
    } else {
      blades.classList.remove("rotate");
      sound.pause();
    }
  }
</script>

</body>
</html>
