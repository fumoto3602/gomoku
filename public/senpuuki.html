<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扇風機</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .fan {
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    position: relative;
  }

  /* 羽根 */
  .blades {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
  }

  /* 回転中 */
  .rotate {
    animation: spin 0.25s linear infinite;
  }

  .blade {
    position: absolute;
    width: 45%;
    height: 12%;
    background: #2f80ed;
    top: 44%;
    left: 50%;
    transform-origin: 0% 50%;
    border-radius: 20px;
  }

  .blade:nth-child(1) { transform: rotate(0deg); }
  .blade:nth-child(2) { transform: rotate(90deg); }
  .blade:nth-child(3) { transform: rotate(180deg); }
  .blade:nth-child(4) { transform: rotate(270deg); }

  .center {
    position: absolute;
    width: 18%;
    height: 18%;
    background: #555;
    border-radius: 50%;
    top: 41%;
    left: 41%;
    z-index: 2;
  }

  .guard {
    position: absolute;
    inset: 0;
    border: 6px solid #aaa;
    border-radius: 50%;
    box-sizing: border-box;
  }

  button {
    margin-top: 24px;
    font-size: 1.3rem;
    padding: 14px 26px;
    border: 5px solid red;
    background: white;
    border-radius: 14px;
    cursor: pointer;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>

<body>

<div class="fan">
  <div class="blades" id="blades">
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
  </div>
  <div class="center"></div>
  <div class="guard"></div>
</div>

<button id="toggleBtn">まわす</button>

<!-- 効果音ラボ -->
<audio id="fanSound" src="fan.mp3" loop></audio>

<script>
  const blades = document.getElementById("blades");
  const button = document.getElementById("toggleBtn");
  const sound = document.getElementById("fanSound");

  let isRunning = false;

  button.addEventListener("click", () => {
    if (isRunning) {
      blades.classList.remove("rotate");
      sound.pause();
      button.textContent = "まわす";
    } else {
      blades.classList.add("rotate");
      sound.currentTime = 0;
      sound.play();
      button.textContent = "とめる";
    }
    isRunning = !isRunning;
  });
</script>

</body>
</html>
