<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ジャンプゲーム</title>
<style>
  body {
    margin: 0;
    background: #eef;
  }
  canvas {
    display: block;
    margin: auto;
    background: #cce;
  }
</style>
</head>
<body>

<canvas id="game" width="600" height="200"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ===== キャラ =====
let player = {
  x: 50,
  y: 150,
  w: 20,
  h: 20,
  vy: 0,
  jumping: false
};

// ===== 障害物 =====
let obstacle = {
  x: 600,
  y: 160,
  w: 20,
  h: 40
};

// ===== ゲーム用変数 =====
const gravity = 0.6;
const jumpPower = -10;

let speed = 3;   // 障害物の速さ
let wait = 0;    // 次の障害物までの待ち
let count = 0;   // 成功回数

// ===== ジャンプ操作 =====
canvas.addEventListener("click", jump);
canvas.addEventListener("touchstart", jump);

function jump() {
  if (!player.jumping) {
    player.vy = jumpPower;
    player.jumping = true;
  }
}

// ===== 更新処理 =====
function update() {
  // キャラの動き
  player.vy += gravity;
  player.y += player.vy;

  // 地面判定
  if (player.y > 150) {
    player.y = 150;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物の動き
  if (wait > 0) {
    wait--;
  } else {
    obstacle.x -= speed;
  }

  // 画面外に出たらリセット＋ランダム
  if (obstacle.x < -obstacle.w) {
    obstacle.x = 600;

    speed = 2 + Math.random() * 3; // 速さ：2〜5
    wait = Math.floor(Math.random() * 60); // 間：0〜60フレーム

    count++; // 成功回数
  }

  // 当たり判定
  if (
    player.x < obstacle.x + obstacle.w &&
    player.x + player.w > obstacle.x &&
    player.y < obstacle.y + obstacle.h &&
    player.y + player.h > obstacle.y
  ) {
    alert("ゲームオーバー");
    obstacle.x = 600;
    count = 0;
  }
}

// ===== 描画 =====
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 地面
  ctx.fillStyle = "#444";
  ctx.fillRect(0, 170, 600, 30);

  // キャラ
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // 障害物
  ctx.fillStyle = "red";
  ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

  // カウンター
  ctx.fillStyle = "black";
  ctx.font = "16px sans-serif";
  ctx.fillText("せいこう: " + count, 10, 20);
}

// ===== ループ =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
